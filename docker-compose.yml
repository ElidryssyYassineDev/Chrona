services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB : keycloak_db
      POSTGRES_USER : keycloak
      POSTGRES_PASSWORD : keycloakAdmin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql
  
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakAdmin
    depends_on:
      postgres:
        condition: service_healthy 

volumes:
  postgres_data: